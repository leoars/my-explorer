			<string>Copy Info.plist strings, icon, notices and privacy manifest; name the resource bundle</string>
			<key>inputPaths</key>
			<array>
				<string>$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/MyExplorer_ExplorerLocalization.bundle</string>
